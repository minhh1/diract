<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Diract Time Tracking</title>
  <style>
    body { width: 280px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; color: #334155; padding: 14px; margin: 0; }
    h1 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 12px; }
    .status { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; }
    .dot.connected { background: #10b981; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    label.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    textarea { width: 100%; box-sizing: border-box; height: 60px; font-size: 11px; padding: 6px; border: 1px solid #e2e8f0; border-radius: 8px; resize: none; }
    p.hint { color: #94a3b8; font-size: 10px; margin: 4px 0 10px; }
    button { width: 100%; padding: 8px; border: none; border-radius: 999px; background: #4f46e5; color: white; font-size: 11px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    a { color: #4f46e5; }
  </style>
</head>
<body>
  <h1>Diract Time Tracking</h1>
  <div class="status">
    <span id="statusDot" class="dot"></span>
    <span id="statusText">Checking...</span>
  </div>

  <div class="row">
    <label class="toggle">
      <input type="checkbox" id="trackingToggle" />
      Track my active tab
    </label>
  </div>

  <div id="connectPrompt" style="display:none">
    <p class="hint">Not connected yet -- open <a id="connectLink" href="#" target="_blank">Diract settings</a> and click Connect.</p>
  </div>

  <label style="display:block; font-size: 10px; font-weight: 700; color:#94a3b8; text-transform: uppercase; margin-bottom: 4px;">Excluded domains</label>
  <textarea id="excludedDomains" placeholder="one per line, e.g. mail.google.com"></textarea>
  <p class="hint">Activity on these domains is never tracked or sent anywhere.</p>

  <button id="syncNowBtn">Sync now</button>

  <script src="popup.js" type="module"></script>
</body>
</html>
