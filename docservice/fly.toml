app = "diract-docservice"
primary_region = "syd"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Kept always-on: a cold start costs ~26s, and document conversion sits in
  # the path of a user waiting for a download.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
